<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <link rel="stylesheet" href="./NUI/vendor/tailwind-2.2.19.min.css">
        <link rel="stylesheet" href="./NUI/css/ers_tokens.css">
        <link rel="stylesheet" href="./NUI/css/ers_theme_overrides.css">
        <link rel="stylesheet" href="./NUI/css/ers_nui_compat.css?v=2"/>
        <link rel="stylesheet" href="./NUI/styles.css?v=18"/>
        <link rel="stylesheet" href="./NUI/css/ers_radial_dial.css?v=9"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"> 
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js" type="text/javascript"></script>
        <script src="./NUI/js/ers_theme.js" type="text/javascript"></script>
        <script src="./NUI/js/ers_theme_legend.js" type="text/javascript"></script>
        <script src="./NUI/js/ers_hud_stage.js" type="text/javascript"></script>
        <script src="./NUI/js/ers_hud_layout_defaults.js" type="text/javascript"></script>
        <script src="./NUI/js/ers_drag.js" type="text/javascript"></script>
        <script src="./NUI/main.js?v=28" type="text/javascript"></script>

    </head>
    <body>
        <div id="background"></div>
        <div id="ers-selection-menu" style="display: none;"></div>
        <!-- Zone A: draggable callout HUD — logical 1920×1080, scaled to viewport (MDT-style stage). -->
        <div id="ers-hud-stage" class="ers-hud-stage">
            <div id="ers-hud-zoom-shell" class="ers-hud-zoom-shell">
                <div id="ers-hud-logical" class="ers-hud-logical">
                    <div id="hint-prompt-container"></div>
                    <div id="callout-prompt-container"></div>
                    <div id="callout-pre-interface-container"></div>
                    <div id="callout-interface-container"></div>
                    <div id="dispatch-message-prompt-container"></div>
                    <div id="ped-interaction-id-card-container">
                        <div id="ped-interaction-id-card" style="display: none;"></div>
                    </div>
                    <div id="vehicle-info-container">
                        <div id="vehicle-info" style="display: none;"></div>
                    </div>
                    <div id="ped-interaction-module-container">
                        <div id="ped-interaction-module" style="display: none;"></div>
                    </div>
                    <div id="ped-interaction-inventory-container">
                        <div id="ped-interaction-inventory" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="minimized-indicator" class="ers-callout-collapsed-chip" style="display: none;" role="button" tabindex="0" aria-label="Toggle callout briefing">
            <div class="ers-callout-collapsed-chip__panel">
                <span class="ers-callout-collapsed-chip__icon" aria-hidden="true"><i class="fas fa-file-lines"></i></span>
                <span id="minimized-indicator-label" class="ers-callout-collapsed-chip__label"></span>
                <span class="ers-callout-collapsed-chip__chevron" aria-hidden="true"><i class="fas fa-chevron-right"></i></span>
            </div>
        </div>
        <div id="unified-prompt" style="display: none;"></div>
        <div id="ped-interaction-questioning" style="display:none;">
            <div id="question-options-list"></div>
            <div id="question-leave-btn"></div>
        </div>
        <div id="question-answers-list"></div>

        <div id="zone-change-ui">
            <span class="old-zone"></span>
            <span class="zone-arrow">»</span>
            <span class="new-zone"></span>
        </div>

        <div id="circle-menu" class="ers-radial-dial"></div>
        <div id="instruction-title" class="instruction-title" style="display: none;"></div>
        <div id="instruction-text" class="instruction-text" style="display: none;"></div>

        <div id="pullover-command-menu" style="display: none;"></div>
        <div id="pullover-progress-overlay" style="display: none;"></div>

        <div id="pursuit-mode-ui" class="pursuit-mode-ui" style="display: none;"></div>
        <div id="pursuit-radial-menu" class="ers-radial-dial"></div>
        <div id="pursuit-instruction-title" class="instruction-title" style="display: none;"></div>
        <div id="pursuit-instruction-text" class="instruction-text" style="display: none;"></div>

        <div class="container" id="notification-area"></div>
        <div class="waypoint" id="waypoint-container" style="display: none;">
            <div class="text-light microtext font-monospace" id="waypoint-distance"></div>
        </div>
        <div class="unit-waypoint" id="unit-waypoint-container" style="display: none;">
            <div class="unit-waypoint-distance" id="unit-waypoint-distance"></div>
        </div>
        <div id="dual-steering-mode" style="display: none;"></div>
    </body>
</html>
